<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#190e2b" />
    </linearGradient>

    <!-- Hair Gradients -->
    <linearGradient id="makimaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="remHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="zeroTwoHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="hinataHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Floor Glow Track -->
    <linearGradient id="floorTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Independent X Translation for Agent Containers */
      @keyframes moveAgent1 {
        0% { transform: translateX(40px); }
        48% { transform: translateX(720px); }
        50% { transform: translateX(720px); }
        98% { transform: translateX(40px); }
        100% { transform: translateX(40px); }
      }

      @keyframes moveAgent2 {
        0% { transform: translateX(740px); }
        48% { transform: translateX(60px); }
        50% { transform: translateX(60px); }
        98% { transform: translateX(740px); }
        100% { transform: translateX(740px); }
      }

      @keyframes moveAgent3 {
        0% { transform: translateX(220px); }
        48% { transform: translateX(620px); }
        50% { transform: translateX(620px); }
        98% { transform: translateX(220px); }
        100% { transform: translateX(220px); }
      }

      @keyframes moveAgent4 {
        0% { transform: translateX(560px); }
        48% { transform: translateX(160px); }
        50% { transform: translateX(160px); }
        98% { transform: translateX(560px); }
        100% { transform: translateX(560px); }
      }

      /* Body Direction Flip ONLY for Body Graphics (Never Text) */
      @keyframes flipRight {
        0%, 48% { transform: scaleX(1); }
        50%, 98% { transform: scaleX(-1); }
        100% { transform: scaleX(1); }
      }

      @keyframes flipLeft {
        0%, 48% { transform: scaleX(-1); }
        50%, 98% { transform: scaleX(1); }
        100% { transform: scaleX(-1); }
      }

      /* Natural Step Bobbing */
      @keyframes stepBob {
        0%, 100% { transform: translateY(0px); }
        25% { transform: translateY(-5px); }
        50% { transform: translateY(0px); }
        75% { transform: translateY(-5px); }
      }

      /* Leg Swing Motion */
      @keyframes legLeft {
        0%, 100% { transform: rotate(20deg); }
        50% { transform: rotate(-20deg); }
      }

      @keyframes legRight {
        0%, 100% { transform: rotate(-20deg); }
        50% { transform: rotate(20deg); }
      }

      /* Shadow Pulse */
      @keyframes shadowPulse {
        0%, 50%, 100% { transform: scaleX(1); opacity: 0.5; }
        25%, 75% { transform: scaleX(0.7); opacity: 0.3; }
      }

      .agent1-root { animation: moveAgent1 24s ease-in-out infinite; }
      .agent2-root { animation: moveAgent2 30s ease-in-out infinite; }
      .agent3-root { animation: moveAgent3 20s ease-in-out infinite; }
      .agent4-root { animation: moveAgent4 26s ease-in-out infinite; }

      .body-flip-right { animation: flipRight 24s ease-in-out infinite; }
      .body-flip-left { animation: flipLeft 30s ease-in-out infinite; }
      .body-flip-right-3 { animation: flipRight 20s ease-in-out infinite; }
      .body-flip-left-4 { animation: flipLeft 26s ease-in-out infinite; }

      .bobbing { animation: stepBob 0.5s ease-in-out infinite; }
      .leg-l { animation: legLeft 0.5s ease-in-out infinite; transform-origin: top center; }
      .leg-r { animation: legRight 0.5s ease-in-out infinite; transform-origin: top center; }
      .sh-anim { animation: shadowPulse 0.5s ease-in-out infinite; transform-origin: center; }

      .section-header {
        font-family: 'Fira Code', 'Segoe UI', monospace;
        font-size: 13px;
        font-weight: 800;
        fill: #38bdf8;
        letter-spacing: 2px;
        text-anchor: middle;
      }

      .badge-title {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: bold;
        text-anchor: middle;
      }

      .badge-desc {
        font-family: 'Fira Code', monospace;
        font-size: 9px;
        fill: #94a3b8;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect width="850" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Cyber Floor Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="850" y2="50" />
    <line x1="0" y1="100" x2="850" y2="100" />
    <line x1="0" y1="150" x2="850" y2="150" />
    <line x1="0" y1="200" x2="850" y2="200" />
  </g>

  <!-- TOP HEADER TITLE -->
  <g transform="translate(425, 32)">
    <rect x="-170" y="-16" width="340" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow)" />
    <text x="0" y="2" class="section-header">🤖 MEET OUR AUTONOMOUS AGENT TEAM</text>
  </g>

  <!-- Walking Floor Runway -->
  <ellipse cx="425" cy="220" rx="400" ry="8" fill="url(#floorTrack)" />
  <line x1="25" y1="220" x2="825" y2="220" stroke="url(#floorTrack)" stroke-width="2.5" stroke-linecap="round" />

  <!-- ==================== AGENT 1: MAKIMA (Lead Orchestrator) ==================== -->
  <g class="agent1-root">
    <!-- Ground Shadow -->
    <ellipse cx="0" cy="220" rx="20" ry="5" fill="#000000" class="sh-anim" />

    <g class="bobbing">
      <!-- ALWAYS UNFLIPPED Text Badge Overhead -->
      <g transform="translate(0, 92)">
        <rect x="-65" y="-22" width="130" height="26" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.2" opacity="0.95" filter="url(#shadow)" />
        <text x="0" y="-8" class="badge-title" fill="#fb923c">⚡ Makima</text>
        <text x="0" y="2" class="badge-desc">Lead Orchestrator</text>
      </g>

      <!-- Flipped Body Graphic Only -->
      <g class="body-flip-right">
        <g transform="translate(0, 175)" filter="url(#shadow)">
          <!-- Legs -->
          <g class="leg-l">
            <rect x="-7" y="10" width="4" height="22" rx="2" fill="#1e293b" />
            <ellipse cx="-5" cy="31" rx="3.5" ry="2" fill="#0f172a" />
          </g>
          <g class="leg-r">
            <rect x="3" y="10" width="4" height="22" rx="2" fill="#334155" />
            <ellipse cx="5" cy="31" rx="3.5" ry="2" fill="#0f172a" />
          </g>

          <!-- Torso / Business Suit Coat -->
          <path d="M -12 -10 L 12 -10 L 14 12 L -14 12 Z" fill="#0f172a" stroke="#f97316" stroke-width="1.2" />
          <!-- White Shirt & Tie -->
          <polygon points="-4,-10 4,-10 0,0" fill="#ffffff" />
          <polygon points="-1.5,-6 1.5,-6 2,8 0,11 -2,8" fill="#ea580c" />

          <!-- Head & Hair (Makima Orange Braid) -->
          <!-- Long Braided Hair Back -->
          <path d="M -10 -25 C -16 -15 -14 10 -18 20 C -12 10 -8 -15 -4 -25 Z" fill="url(#makimaHair)" />
          <!-- Head Base -->
          <circle cx="0" cy="-24" r="11" fill="#fff7ed" />
          <!-- Orange Hair Front Bangs -->
          <path d="M -12 -28 C -6 -20 0 -22 4 -28 C 8 -22 12 -25 12 -30 C 6 -34 -6 -34 -12 -28 Z" fill="url(#makimaHair)" />

          <!-- Amber Eyes -->
          <circle cx="4" cy="-24" r="2" fill="#f59e0b" />
          <circle cx="4.5" cy="-24.5" r="0.7" fill="#ffffff" />

          <!-- Golden Halo Ring Overhead -->
          <ellipse cx="0" cy="-37" rx="9" ry="3" fill="none" stroke="#f59e0b" stroke-width="1.5" filter="url(#neonGlow)" />
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== AGENT 2: REM (Web Researcher) ==================== -->
  <g class="agent2-root">
    <ellipse cx="0" cy="220" rx="20" ry="5" fill="#000000" class="sh-anim" />

    <g class="bobbing">
      <!-- ALWAYS UNFLIPPED Text Badge Overhead -->
      <g transform="translate(0, 92)">
        <rect x="-65" y="-22" width="130" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" filter="url(#shadow)" />
        <text x="0" y="-8" class="badge-title" fill="#38bdf8">🦅 Rem</text>
        <text x="0" y="2" class="badge-desc">Web Researcher</text>
      </g>

      <!-- Flipped Body Graphic Only -->
      <g class="body-flip-left">
        <g transform="translate(0, 175)" filter="url(#shadow)">
          <!-- Legs -->
          <g class="leg-l">
            <rect x="-7" y="10" width="4" height="22" rx="2" fill="#0284c7" />
            <ellipse cx="-5" cy="31" rx="3.5" ry="2" fill="#0369a1" />
          </g>
          <g class="leg-r">
            <rect x="3" y="10" width="4" height="22" rx="2" fill="#38bdf8" />
            <ellipse cx="5" cy="31" rx="3.5" ry="2" fill="#0369a1" />
          </g>

          <!-- Cyber Maid / Researcher Outfit -->
          <path d="M -11 -10 L 11 -10 L 15 12 L -15 12 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
          <path d="M -8 -10 L 8 -10 L 5 4 L -5 4 Z" fill="#e0f2fe" />

          <!-- Blue Hair & Head -->
          <circle cx="0" cy="-24" r="11" fill="#fff7ed" />
          <!-- Blue Twin-Bangs (Rem Style) -->
          <path d="M -12 -28 C -6 -18 -1 -15 2 -26 C 6 -16 12 -22 12 -30 C 4 -34 -6 -34 -12 -28 Z" fill="url(#remHair)" />
          <path d="M -13 -26 C -14 -12 -12 2 -15 10 C -10 2 -10 -15 -10 -26 Z" fill="url(#remHair)" />

          <!-- Cyan Glowing Eyes -->
          <circle cx="4" cy="-23" r="2.2" fill="#00f2fe" />
          <circle cx="4.5" cy="-23.5" r="0.7" fill="#ffffff" />

          <!-- Pink Ribbon Hair Clip -->
          <rect x="-8" y="-31" width="6" height="4" rx="1" fill="#ec4899" />
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== AGENT 3: ZERO TWO (Lead Systems Coder) ==================== -->
  <g class="agent3-root">
    <ellipse cx="0" cy="220" rx="20" ry="5" fill="#000000" class="sh-anim" />

    <g class="bobbing">
      <!-- ALWAYS UNFLIPPED Text Badge Overhead -->
      <g transform="translate(0, 92)">
        <rect x="-65" y="-22" width="130" height="26" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" opacity="0.95" filter="url(#shadow)" />
        <text x="0" y="-8" class="badge-title" fill="#f472b6">🌸 Zero Two</text>
        <text x="0" y="2" class="badge-desc">Lead Systems Coder</text>
      </g>

      <!-- Flipped Body Graphic Only -->
      <g class="body-flip-right-3">
        <g transform="translate(0, 175)" filter="url(#shadow)">
          <!-- Legs -->
          <g class="leg-l">
            <rect x="-7" y="10" width="4" height="22" rx="2" fill="#9f1239" />
            <ellipse cx="-5" cy="31" rx="3.5" ry="2" fill="#4c0519" />
          </g>
          <g class="leg-r">
            <rect x="3" y="10" width="4" height="22" rx="2" fill="#e11d48" />
            <ellipse cx="5" cy="31" rx="3.5" ry="2" fill="#881337" />
          </g>

          <!-- Red Pilot Uniform -->
          <path d="M -12 -10 L 12 -10 L 14 12 L -14 12 Z" fill="#e11d48" stroke="#ffe4e6" stroke-width="1.2" />
          <line x1="0" y1="-10" x2="0" y2="12" stroke="#ffffff" stroke-width="1.5" />

          <!-- Pink Hair & Head -->
          <!-- Long Pink Hair Back -->
          <path d="M -11 -25 C -15 -10 -15 12 -18 22 C -11 12 -7 -10 -3 -25 Z" fill="url(#zeroTwoHair)" />
          <circle cx="0" cy="-24" r="11" fill="#fff7ed" />
          <!-- Pink Hair Front Bangs -->
          <path d="M -12 -28 C -6 -20 0 -22 4 -28 C 8 -20 12 -25 12 -30 C 6 -34 -6 -34 -12 -28 Z" fill="url(#zeroTwoHair)" />

          <!-- Emerald Green Eyes (Zero Two Signature) -->
          <circle cx="4" cy="-24" r="2.2" fill="#10b981" />
          <circle cx="4.5" cy="-24.5" r="0.7" fill="#ffffff" />
          <!-- Red Eyeliner Accent -->
          <path d="M 2 -27 Q 6 -27 7 -25" fill="none" stroke="#e11d48" stroke-width="1.2" />

          <!-- Red Cyber Horns -->
          <polygon points="-5,-31 -9,-40 -2,-34" fill="#e11d48" filter="url(#neonGlow)" />
          <polygon points="5,-31 9,-40 2,-34" fill="#e11d48" filter="url(#neonGlow)" />
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== AGENT 4: HINATA (Security Auditor) ==================== -->
  <g class="agent4-root">
    <ellipse cx="0" cy="220" rx="20" ry="5" fill="#000000" class="sh-anim" />

    <g class="bobbing">
      <!-- ALWAYS UNFLIPPED Text Badge Overhead -->
      <g transform="translate(0, 92)">
        <rect x="-65" y="-22" width="130" height="26" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2" opacity="0.95" filter="url(#shadow)" />
        <text x="0" y="-8" class="badge-title" fill="#c084fc">🧠 Hinata</text>
        <text x="0" y="2" class="badge-desc">Security Auditor</text>
      </g>

      <!-- Flipped Body Graphic Only -->
      <g class="body-flip-left-4">
        <g transform="translate(0, 175)" filter="url(#shadow)">
          <!-- Legs -->
          <g class="leg-l">
            <rect x="-7" y="10" width="4" height="22" rx="2" fill="#4c1d95" />
            <ellipse cx="-5" cy="31" rx="3.5" ry="2" fill="#2e1065" />
          </g>
          <g class="leg-r">
            <rect x="3" y="10" width="4" height="22" rx="2" fill="#7c3aed" />
            <ellipse cx="5" cy="31" rx="3.5" ry="2" fill="#2e1065" />
          </g>

          <!-- Lavender Cyber Jacket -->
          <path d="M -13 -10 L 13 -10 L 15 12 L -15 12 Z" fill="#6d28d9" stroke="#ddd6fe" stroke-width="1.2" />
          <path d="M -5 -10 L 5 -10 L 3 12 L -3 12 Z" fill="#f3e8ff" />

          <!-- Dark Indigo Hair & Head -->
          <circle cx="0" cy="-24" r="11" fill="#fff7ed" />
          <!-- Dark Hime-Cut Hair Bangs (Hinata Style) -->
          <path d="M -12 -28 C -7 -18 -2 -18 3 -28 C 7 -18 12 -22 12 -30 C 4 -34 -6 -34 -12 -28 Z" fill="url(#hinataHair)" />
          <path d="M -12 -26 C -13 -12 -12 2 -14 12 C -9 2 -9 -15 -9 -26 Z" fill="url(#hinataHair)" />

          <!-- Lavender/White Byakugan Eyes -->
          <circle cx="4" cy="-23" r="2.4" fill="#ede9fe" stroke="#c084fc" stroke-width="0.8" />
          <circle cx="4.5" cy="-23.5" r="0.7" fill="#ffffff" />
        </g>
      </g>
    </g>
  </g>

</svg>
