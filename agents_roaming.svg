<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Dark Cyber Grid Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>

    <!-- Metallic & Neon Gradients -->
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="shaheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="dshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Floor Glow Track -->
    <linearGradient id="floorTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Realistic Walking Keyframe Trajectories */
      @keyframes walkCycle1 {
        0% { transform: translateX(30px) scaleX(1); }
        48% { transform: translateX(730px) scaleX(1); }
        50% { transform: translateX(730px) scaleX(-1); }
        98% { transform: translateX(30px) scaleX(-1); }
        100% { transform: translateX(30px) scaleX(1); }
      }

      @keyframes walkCycle2 {
        0% { transform: translateX(750px) scaleX(-1); }
        48% { transform: translateX(50px) scaleX(-1); }
        50% { transform: translateX(50px) scaleX(1); }
        98% { transform: translateX(750px) scaleX(1); }
        100% { transform: translateX(750px) scaleX(-1); }
      }

      @keyframes walkCycle3 {
        0% { transform: translateX(250px) scaleX(1); }
        48% { transform: translateX(650px) scaleX(1); }
        50% { transform: translateX(650px) scaleX(-1); }
        98% { transform: translateX(250px) scaleX(-1); }
        100% { transform: translateX(250px) scaleX(1); }
      }

      @keyframes walkCycle4 {
        0% { transform: translateX(550px) scaleX(-1); }
        48% { transform: translateX(150px) scaleX(-1); }
        50% { transform: translateX(150px) scaleX(1); }
        98% { transform: translateX(550px) scaleX(1); }
        100% { transform: translateX(550px) scaleX(-1); }
      }

      /* Realistic Vertical Step Bobbing */
      @keyframes realisticStep {
        0%, 100% { transform: translateY(0px); }
        25% { transform: translateY(-4px) rotate(1.5deg); }
        50% { transform: translateY(0px); }
        75% { transform: translateY(-4px) rotate(-1.5deg); }
      }

      /* Articulated Dual-Leg Swing */
      @keyframes legFront {
        0%, 100% { transform: rotate(22deg); }
        50% { transform: rotate(-22deg); }
      }

      @keyframes legBack {
        0%, 100% { transform: rotate(-22deg); }
        50% { transform: rotate(22deg); }
      }

      /* Ground Drop Shadow Scale */
      @keyframes shadowPulse {
        0%, 50%, 100% { transform: scaleX(1); opacity: 0.5; }
        25%, 75% { transform: scaleX(0.75); opacity: 0.3; }
      }

      .agent1-wrap { animation: walkCycle1 24s ease-in-out infinite; }
      .agent2-wrap { animation: walkCycle2 30s ease-in-out infinite; }
      .agent3-wrap { animation: walkCycle3 20s ease-in-out infinite; }
      .agent4-wrap { animation: walkCycle4 26s ease-in-out infinite; }

      .body-bob { animation: realisticStep 0.55s ease-in-out infinite; }
      .leg-front { animation: legFront 0.55s ease-in-out infinite; transform-origin: top center; }
      .leg-back { animation: legBack 0.55s ease-in-out infinite; transform-origin: top center; }
      .shadow-anim { animation: shadowPulse 0.55s ease-in-out infinite; transform-origin: center; }

      .team-title {
        font-family: 'Fira Code', 'Segoe UI', monospace;
        font-size: 13px;
        font-weight: 800;
        fill: #38bdf8;
        letter-spacing: 2px;
        text-anchor: middle;
      }

      .badge-name {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: bold;
        text-anchor: middle;
      }

      .badge-task {
        font-family: 'Fira Code', monospace;
        font-size: 9px;
        fill: #94a3b8;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Cyber Floor Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="850" y2="50" />
    <line x1="0" y1="100" x2="850" y2="100" />
    <line x1="0" y1="150" x2="850" y2="150" />
    <line x1="0" y1="200" x2="850" y2="200" />
  </g>

  <!-- TEAM TITLE SECTION HEADER -->
  <g transform="translate(425, 32)">
    <rect x="-170" y="-16" width="340" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow)" />
    <text x="0" y="1" class="team-title">🤖 MEET OUR AUTONOMOUS AGENT TEAM</text>
  </g>

  <!-- Walking Floor Runway -->
  <ellipse cx="425" cy="205" rx="400" ry="8" fill="url(#floorTrack)" />
  <line x1="25" y1="205" x2="825" y2="205" stroke="url(#floorTrack)" stroke-width="2.5" stroke-linecap="round" />

  <!-- ==================== AGENT 1: Claude-Ops ==================== -->
  <g class="agent1-wrap">
    <!-- Ground Shadow -->
    <ellipse cx="0" cy="205" rx="22" ry="5" fill="#000000" class="shadow-anim" />

    <g class="body-bob">
      <!-- Holographic Status Badge -->
      <g transform="translate(0, 95)">
        <rect x="-65" y="-22" width="130" height="26" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.2" opacity="0.95" filter="url(#shadow)" />
        <text x="0" y="-8" class="badge-name" fill="#fb923c">⚡ Claude-Ops</text>
        <text x="0" y="2" class="badge-task">Active • Merging PR #142</text>
      </g>

      <!-- Realistic Bot Body -->
      <g transform="translate(0, 160)" filter="url(#shadow)">
        <!-- Articulated Legs -->
        <g class="leg-back">
          <rect x="-9" y="14" width="5" height="18" rx="2.5" fill="#c2410c" />
          <ellipse cx="-6.5" cy="32" rx="4" ry="2" fill="#7c2d12" />
        </g>
        <g class="leg-front">
          <rect x="4" y="14" width="5" height="18" rx="2.5" fill="#ea580c" />
          <ellipse cx="6.5" cy="32" rx="4" ry="2" fill="#9a3412" />
        </g>

        <!-- Torso & Chassis -->
        <rect x="-18" y="-18" width="36" height="34" rx="10" fill="url(#claudeGrad)" stroke="#ffedd5" stroke-width="1.5" />
        <rect x="-14" y="-14" width="28" height="26" rx="7" fill="#1e1035" opacity="0.4" />

        <!-- Claude Sparkle Core -->
        <path d="M 0 -5 L 2 -1 L 6 0 L 2 1 L 0 5 L -2 1 L -6 0 L -2 -1 Z" fill="#ffffff" filter="url(#glowCyan)" />

        <!-- Head Antenna & Pulsing Light -->
        <line x1="0" y1="-18" x2="0" y2="-26" stroke="#f97316" stroke-width="2" />
        <circle cx="0" cy="-27" r="3.5" fill="#ffedd5" />
      </g>
    </g>
  </g>

  <!-- ==================== AGENT 2: Shaheen-Core ==================== -->
  <g class="agent2-wrap">
    <ellipse cx="0" cy="205" rx="24" ry="5" fill="#000000" class="shadow-anim" />

    <g class="body-bob">
      <!-- Holographic Status Badge -->
      <g transform="translate(0, 92)">
        <rect x="-70" y="-22" width="140" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" filter="url(#shadow)" />
        <text x="0" y="-8" class="badge-name" fill="#38bdf8">🦅 Shaheen-Core</text>
        <text x="0" y="2" class="badge-task">Active • Stealth MicroVM</text>
      </g>

      <!-- Bot Chassis -->
      <g transform="translate(0, 160)" filter="url(#shadow)">
        <!-- Articulated Legs -->
        <g class="leg-back">
          <rect x="-10" y="14" width="5" height="18" rx="2.5" fill="#0369a1" />
          <ellipse cx="-7.5" cy="32" rx="4" ry="2" fill="#0c4a6e" />
        </g>
        <g class="leg-front">
          <rect x="5" y="14" width="5" height="18" rx="2.5" fill="#0284c7" />
          <ellipse cx="7.5" cy="32" rx="4" ry="2" fill="#0369a1" />
        </g>

        <!-- Body -->
        <rect x="-20" y="-18" width="40" height="34" rx="9" fill="url(#shaheenGrad)" stroke="#e0f2fe" stroke-width="1.5" />

        <!-- Cyber Visor -->
        <rect x="-15" y="-10" width="30" height="14" rx="5" fill="#090d16" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="-5" cy="-3" r="2.5" fill="#38bdf8" />
        <circle cx="5" cy="-3" r="2.5" fill="#38bdf8" />

        <!-- Eagle Cyber Wings -->
        <path d="M -20 -4 L -29 -14 L -20 6 Z" fill="#38bdf8" opacity="0.9" />
        <path d="M 20 -4 L 29 -14 L 20 6 Z" fill="#38bdf8" opacity="0.9" />
      </g>
    </g>
  </g>

  <!-- ==================== AGENT 3: DSH-Scout ==================== -->
  <g class="agent3-wrap">
    <ellipse cx="0" cy="205" rx="22" ry="5" fill="#000000" class="shadow-anim" />

    <g class="body-bob">
      <!-- Holographic Status Badge -->
      <g transform="translate(0, 96)">
        <rect x="-65" y="-22" width="130" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.95" filter="url(#shadow)" />
        <text x="0" y="-8" class="badge-name" fill="#c084fc">🔌 DSH-Scout</text>
        <text x="0" y="2" class="badge-task">Active • Knowledge Graph</text>
      </g>

      <!-- Bot Chassis -->
      <g transform="translate(0, 160)" filter="url(#shadow)">
        <g class="leg-back">
          <rect x="-8" y="14" width="5" height="18" rx="2.5" fill="#6b21a8" />
          <ellipse cx="-5.5" cy="32" rx="4" ry="2" fill="#3b0764" />
        </g>
        <g class="leg-front">
          <rect x="3" y="14" width="5" height="18" rx="2.5" fill="#a855f7" />
          <ellipse cx="5.5" cy="32" rx="4" ry="2" fill="#581c87" />
        </g>

        <!-- Body -->
        <rect x="-17" y="-17" width="34" height="34" rx="8" fill="url(#dshGrad)" stroke="#f3e8ff" stroke-width="1.5" transform="rotate(45)" />

        <!-- Visor Face -->
        <circle cx="-5" cy="-2" r="3.5" fill="#ffffff" />
        <circle cx="5" cy="-2" r="3.5" fill="#ffffff" />
        <circle cx="-4" cy="-2" r="1.8" fill="#3b0764" />
        <circle cx="6" cy="-2" r="1.8" fill="#3b0764" />
      </g>
    </g>
  </g>

  <!-- ==================== AGENT 4: Prime-RLM ==================== -->
  <g class="agent4-wrap">
    <ellipse cx="0" cy="205" rx="22" ry="5" fill="#000000" class="shadow-anim" />

    <g class="body-bob">
      <!-- Holographic Status Badge -->
      <g transform="translate(0, 94)">
        <rect x="-65" y="-22" width="130" height="26" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.95" filter="url(#shadow)" />
        <text x="0" y="-8" class="badge-name" fill="#34d399">🧠 Prime-RLM</text>
        <text x="0" y="2" class="badge-task">Active • Code Synthesis</text>
      </g>

      <!-- Bot Chassis -->
      <g transform="translate(0, 160)" filter="url(#shadow)">
        <g class="leg-back">
          <rect x="-9" y="14" width="5" height="18" rx="2.5" fill="#047857" />
          <ellipse cx="-6.5" cy="32" rx="4" ry="2" fill="#022c22" />
        </g>
        <g class="leg-front">
          <rect x="4" y="14" width="5" height="18" rx="2.5" fill="#10b981" />
          <ellipse cx="6.5" cy="32" rx="4" ry="2" fill="#065f46" />
        </g>

        <!-- Body -->
        <rect x="-18" y="-18" width="36" height="34" rx="9" fill="url(#primeGrad)" stroke="#ecfdf5" stroke-width="1.5" />

        <!-- Live Terminal Screen -->
        <rect x="-13" y="-11" width="26" height="18" rx="4" fill="#022c22" stroke="#34d399" stroke-width="1" />
        <text x="0" y="2" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">&gt;_ai</text>
      </g>
    </g>
  </g>

</svg>
